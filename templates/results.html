<!-- templates/results.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Compliance Results – ComplyAI</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #F5F3FF;
            color: #1f1230;
        }

        .page-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            overflow: hidden;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.18);
        }

        .logo img {
            max-width: 100%;
            max-height: 100%;
        }

        .header-text h1 {
            margin: 0;
            font-size: 22px;
            color: #25213A;
        }

        .header-text p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #6B6885;
        }

        .content-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px 24px 26px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border: 1px solid rgba(157,141,241,0.35);
        }

        .content-card h2 {
            margin-top: 0;
            font-size: 18px;
            color: #25213A;
        }

        ul {
            padding-left: 20px;
            margin: 10px 0 0;
            color: #333247;
        }

        li {
            margin-bottom: 6px;
        }

        .empty-message {
            margin: 0;
            color: #333247;
        }

        .actions {
            margin-top: 22px;
        }

        .primary-button {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #6200B3, #7238BE);
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0,0,0,0.18);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .primary-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 9px 20px rgba(0,0,0,0.22);
        }

        .primary-button:active {
            transform: translateY(0);
            box-shadow: 0 5px 12px rgba(0,0,0,0.16);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div class="logo">
                <img src="/static/images/logo.png" alt="Comply AI">
            </div>
            <div class="header-text">
                <h1>Compliance analysis</h1>
                <p>Results for <strong>{{ file_name }}</strong></p>
            </div>
        </header>

        <main class="content-card">
            <h2>Findings</h2>

            {% if results %}
                <ul>
                {% for item in results %}
                    <li>{{ item }}</li>
                {% endfor %}
                </ul>
            {% else %}
                <p class="empty-message">
                    No gaps found. Document appears compliant with NIST standards.
                </p>
            {% endif %}

            <div class="actions">
                <a href="/dashboard" class="primary-button">Back to dashboard</a>
            </div>
        </main>
    </div>
</body>
</html>
